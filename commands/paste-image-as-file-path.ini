[Command]
Name=Paste Image as File Path
Command="
    copyq:
    var tempDir = Dir().tempPath()
    var prefix = 'copyq-image-'
    var now = Date.now()
    var maxAgeMs = 24 * 60 * 60 * 1000

    // Remove old image files created by this command.
    Dir(tempDir).entryList([prefix + '*.png']).forEach(function(name) {
        var created = parseInt(name.slice(prefix.length))
        if (now - created > maxAgeMs)
            new File(tempDir + '/' + name).remove()
    })

    var f = new TemporaryFile()
    f.setFileTemplate(tempDir + '/' + prefix + now + '-XXXXXX.png')
    f.setAutoRemove(false)
    var saved = f.open() && f.write(input()) != -1
    var error = saved ? '' : f.errorString()
    f.close()
    if (!saved) {
        f.remove()
        throw 'Failed to save the image: ' + error
    }

    var path = f.fileName()
    copy(path)
    copySelection(path)
    paste()"
Input=image/png
InMenu=true
HideWindow=true
Icon=\xf03e
